<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="author" content="Ondrandy" />
  <meta name="theme-color" content="#f0f2f5" id="meta-theme-color" />
  <title>Solitaire</title>
  <style>
    :root {
      --bg: #f0f2f5;
      --card: #ffffff;
      --border: #dcdfe4;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --accent-border: #bfdbfe;
      --text: #1e293b;
      --text-muted: #64748b;
      --board-bg: #f0f2f5;
      --slot-bg: #ffffff;
      --slot-border: #cbd5e1;
      --card-face: #ffffff;
      --card-border: #cbd5e1;
      --suit-red: #dc2626;
      --suit-black: #0f172a;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.08);
      --shadow-md: 0 6px 16px rgba(15, 23, 42, 0.14);
      --gold-grad: linear-gradient(135deg, #fef08a 0%, #f59e0b 55%, #b45309 100%);
    }

    body.royal-gold {
      --bg: #0f172a;
      --card: #162033;
      --border: rgba(251, 191, 36, 0.35);
      --accent: #f59e0b;
      --accent-soft: rgba(245, 158, 11, 0.14);
      --accent-border: rgba(251, 191, 36, 0.45);
      --text: #fef3c7;
      --text-muted: #fde68a;
      --board-bg: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
      --slot-bg: rgba(30, 41, 59, 0.72);
      --slot-border: rgba(251, 191, 36, 0.38);
      --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.45);
      --shadow-md: 0 8px 20px rgba(0, 0, 0, 0.65);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      touch-action: manipulation;
    }

    button {
      font-family: inherit;
    }

    .app-shell {
      width: 100%;
      max-width: 440px;
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      position: relative;
      padding-top: env(safe-area-inset-top);
    }

    /* HEADER */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header-stat {
      font-size: 13.5px;
      color: var(--text-muted);
      font-weight: 500;
      white-space: nowrap;
    }

    .header-stat strong {
      color: var(--text);
      font-weight: 700;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .brand-icon {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: var(--accent);
    }

    body.royal-gold .brand-title {
      background: var(--gold-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    /* FIXED HEIGHT STATUS BAR */
    .status-wrap {
      padding: 8px 10px 4px 10px;
      flex-shrink: 0;
    }

    .status-bar {
      height: 46px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.25;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      border-radius: 12px;
    }

    /* GAME BOARD */
    .board {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 6px 8px 4px 8px;
      background: var(--board-bg);
      position: relative;
      overflow: hidden;
    }

    .top-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .tableau-row {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      position: relative;
      min-height: 0;
    }

    .slot {
      aspect-ratio: 5 / 7.2;
      border-radius: 9px;
      border: 1.5px dashed var(--slot-border);
      background: var(--slot-bg);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slot-stock {
      cursor: pointer;
    }

    .stock-recycle {
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
    }

    .column {
      position: relative;
      height: 100%;
      border-radius: 9px;
    }

    .column-empty-target {
      width: 100%;
      aspect-ratio: 5 / 7.2;
      border-radius: 9px;
      border: 1.5px dashed var(--slot-border);
      background: var(--slot-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-muted);
      opacity: 0.55;
    }

    /* CARDS - HIGH CONTRAST NO-GLASSES DESIGN */
    .card {
      position: absolute;
      left: 0;
      right: 0;
      width: 100%;
      aspect-ratio: 5 / 7.2;
      border-radius: 8px;
      background: var(--card-face);
      border: 1.5px solid var(--card-border);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease;
      overflow: hidden;
      touch-action: none;
    }

    .card.dragging-hidden {
      visibility: hidden !important;
      pointer-events: none !important;
    }

    .card.face-up {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card.red {
      color: var(--suit-red);
    }

    .card.black {
      color: var(--suit-black);
    }

    /* Face Theme 2: Soft Tinted (1 win) */
    body.face-tinted .card.face-up.red {
      background: #fff5f5;
      border-color: #fca5a5;
    }
    body.face-tinted .card.face-up.black {
      background: #f8fafc;
      border-color: #94a3b8;
    }

    /* Face Theme 3: Night Contrast (5 wins) */
    body.face-dark .card.face-up {
      background: #1e293b;
      border-color: #475569;
    }
    body.face-dark .card.face-up.red {
      color: #ff6b6b;
    }
    body.face-dark .card.face-up.black {
      color: #f8fafc;
    }

    /* Face Theme 4: Truly Metallic Gold (10 wins) */
    body.face-royal .card.face-up {
      background: linear-gradient(145deg, #fef08a 0%, #f59e0b 48%, #d97706 100%);
      border: 1.5px solid #fef9c3;
      box-shadow: inset 0 0 0 1px rgba(146, 64, 14, 0.35), var(--shadow-sm);
    }
    body.face-royal .card.face-up.red {
      color: #991b1b;
    }
    body.face-royal .card.face-up.black {
      color: #0f172a;
    }

    /* Face Theme 6: Classic Canasta / Rummy Deck (40 wins) */
    body.face-canasta .card.face-up {
      background: #fffdf7;
      border: 1.5px solid #d6c7a9;
      padding: 2px;
    }
    body.face-canasta .card.face-up.red {
      color: #c81e1e;
    }
    body.face-canasta .card.face-up.black {
      color: #111827;
    }

    .canasta-frame {
      width: 100%;
      height: 100%;
      border: 1px solid #d4af37;
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      padding: 1px 2px;
    }

    .canasta-corner-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      line-height: 1;
      font-weight: 800;
    }

    .canasta-corner-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      line-height: 1;
      font-weight: 800;
      transform: rotate(180deg);
    }

    .canasta-mid {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      line-height: 1;
    }

    .canasta-pip-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .canasta-pip-row svg {
      width: clamp(11px, 3.2vw, 14px);
      height: clamp(11px, 3.2vw, 14px);
    }

    .canasta-center-rank {
      font-size: clamp(15px, 4.5vw, 19px);
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 1px 0;
    }

    .card.selected {
      border: 2.5px solid var(--accent) !important;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.28), var(--shadow-md);
      z-index: 60 !important;
    }

    body.royal-gold .card.selected {
      border-color: #fef08a !important;
      box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.45), var(--shadow-md);
    }

    .card.hint-glow {
      border: 2.5px solid var(--accent) !important;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.35);
    }

    /* SIGNPOST TARGET HIGHLIGHT */
    .signpost-target {
      position: absolute;
      inset: -2px;
      border-radius: 9px;
      border: 2.5px solid var(--accent);
      background: rgba(37, 99, 235, 0.14);
      z-index: 80;
      cursor: pointer;
      animation: pulseTarget 1.15s infinite ease-in-out;
    }

    body.royal-gold .signpost-target {
      border-color: #fef08a;
      background: rgba(245, 158, 11, 0.22);
    }

    @keyframes pulseTarget {
      0%, 100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.35); }
      50% { box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12); }
    }

    .card-top-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 4px 0 4px;
      line-height: 1;
      font-weight: 800;
    }

    .card-rank-sm {
      font-size: clamp(13px, 3.8vw, 16px);
      letter-spacing: -0.6px;
    }

    .card-suit-sm svg {
      width: clamp(11px, 3.2vw, 14px);
      height: clamp(11px, 3.2vw, 14px);
      display: block;
    }

    .card-center-hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 0.95;
      padding-bottom: 3px;
      gap: 2px;
    }

    .card-rank-xl {
      font-size: clamp(19px, 5.8vw, 25px);
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .card-suit-xl svg {
      width: clamp(17px, 5vw, 22px);
      height: clamp(17px, 5vw, 22px);
      display: block;
    }

    /* Face down SVG container */
    .card.face-down {
      padding: 2px;
      background: #ffffff;
    }

    body.royal-gold .card.face-down {
      background: #0f172a;
      border-color: rgba(251, 191, 36, 0.55);
    }

    body.royal-gold .card.face-down.light-back {
      background: #ffffff;
    }

    .card-back-svg {
      width: 100%;
      height: 100%;
      border-radius: 6px;
      display: block;
    }

    .drag-layer {
      position: fixed;
      pointer-events: none;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
    }

    /* BOTTOM CONTROLS */
    .controls {
      margin-top: auto;
      padding: 8px 10px;
      padding-bottom: max(14px, env(safe-area-inset-bottom));
      background: var(--card);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: 0.95fr 1fr 1fr 1.2fr;
      gap: 7px;
      flex-shrink: 0;
    }

    .btn {
      height: 42px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 0 6px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn.primary {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    body.royal-gold .btn.primary {
      background: var(--gold-grad);
      color: #0f172a;
      border: none;
      font-weight: 700;
    }

    /* MODALS */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 200;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 412px;
      max-height: 88dvh;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }

    .modal-body {
      padding: 18px 16px 14px 16px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.45;
    }

    .modal-title-center {
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 14px 0;
      color: var(--text);
    }

    .stats-summary-box {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 6px;
      margin-bottom: 14px;
      text-align: center;
    }

    .stats-summary-item {
      padding: 4px;
      border-radius: 8px;
    }

    .stats-summary-item.gold-pill {
      background: #fef9c3;
      border: 1px solid #fde047;
      color: #854d0e;
    }

    body.royal-gold .stats-summary-item.gold-pill {
      background: rgba(245, 158, 11, 0.18);
      border-color: rgba(251, 191, 36, 0.45);
      color: #fef08a;
    }

    .stats-summary-lbl {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .stats-summary-val {
      font-size: 15px;
      font-weight: 700;
      margin-top: 2px;
    }

    .setting-group {
      margin-bottom: 14px;
    }

    .setting-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .seg-btn {
      padding: 10px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .seg-btn .lang-code {
      font-size: 10.5px;
      font-weight: 700;
      opacity: 0.78;
      margin-right: 3px;
    }

    .seg-btn.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .unlock-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .unlock-card {
      border: 1.5px solid var(--border);
      background: var(--card);
      border-radius: 12px;
      padding: 10px 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      position: relative;
      text-align: center;
    }

    .unlock-card.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .unlock-card.active .unlock-name {
      color: var(--accent);
    }

    .unlock-check {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .unlock-card.locked {
      background: var(--bg);
      opacity: 0.72;
      cursor: not-allowed;
    }

    .unlock-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .unlock-req {
      font-size: 11px;
      font-weight: 400;
      color: var(--text-muted);
    }

    .info-box-gray {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--text);
      margin-bottom: 12px;
    }

    .info-box-green {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.45;
      color: #166534;
      margin: 10px 0;
    }

    body.royal-gold .info-box-green {
      background: rgba(22, 163, 74, 0.16);
      border-color: rgba(74, 222, 128, 0.35);
      color: #bbf7d0;
    }

    .text-danger {
      color: #b91c1c;
      font-size: 13px;
      margin: 10px 0 6px 0;
    }

    body.royal-gold .text-danger {
      color: #fca5a5;
    }

    .text-amber {
      color: #b45309;
      font-size: 13px;
      margin: 6px 0 12px 0;
    }

    body.royal-gold .text-amber {
      color: #fde68a;
    }

    .modal-full-btn {
      width: 100%;
      height: 44px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 8px;
    }

    .author-footer {
      margin-top: 12px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .rules-list {
      padding-left: 18px;
      margin: 6px 0;
    }

    .rules-list li {
      margin-bottom: 5px;
    }

    .win-badge {
      width: 78px;
      height: 78px;
      margin: 0 auto 10px auto;
      display: block;
    }

    .unlock-link {
      text-decoration: underline;
      cursor: pointer;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <!-- Shared Noble Metal SVG Gradients & Patterns -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="metal-yellow-gold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fef08a" />
        <stop offset="55%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#b45309" />
      </linearGradient>
      <linearGradient id="metal-rose-gold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fce7f3" />
        <stop offset="55%" stop-color="#f472b6" />
        <stop offset="100%" stop-color="#be185d" />
      </linearGradient>
      <linearGradient id="metal-platinum" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="55%" stop-color="#cbd5e1" />
        <stop offset="100%" stop-color="#64748b" />
      </linearGradient>
      <!-- Real Card Back 1: Crimson Dotted Matrix Pattern -->
      <pattern id="pat-crimson-dots" width="3.5" height="3.5" patternUnits="userSpaceOnUse">
        <circle cx="1.75" cy="1.75" r="0.85" fill="#e11d48" opacity="0.55" />
      </pattern>
      <!-- Real Card Back 2: Blue Diagonal Tartan Plaid Pattern -->
      <pattern id="pat-blue-tartan" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="16" height="16" fill="#ffffff" />
        <line x1="0" y1="2" x2="16" y2="2" stroke="#0284c7" stroke-width="1.3" />
        <line x1="0" y1="5.5" x2="16" y2="5.5" stroke="#38bdf8" stroke-width="0.75" />
        <line x1="0" y1="9" x2="16" y2="9" stroke="#0369a1" stroke-width="1.5" />
        <line x1="0" y1="12.5" x2="16" y2="12.5" stroke="#7dd3fc" stroke-width="0.7" />
        <line x1="2" y1="0" x2="2" y2="16" stroke="#0284c7" stroke-width="1.3" />

          rulesTitle: 'How to Play Solitaire',
          rulesUnderstandBtn: 'Got it, play',
          rulesHtml: `

          `,
          suitNames: {
            spades: 'Spades',
            hearts: 'Hearts',
            clubs: 'Clubs',
            diamonds: 'Diamonds'
          },
          faces: {
            classic: 'High-Contrast',
            tinted: 'Soft Tinted',
            dark: 'Night Contrast',
            royal: 'Royal Gold',
            rainbow: 'Rainbow',
            canasta: 'Canasta Rummy'
          },
          backs: {
            royal_blue: 'Blue Lattice',
            crimson_crest: 'Crimson Crest',
            emerald_geo: 'Emerald Back',
            noble_gold: 'Noble Metals',
            crimson_filigree: 'Crimson Filigree',
            blue_tartan: 'Blue Tartan'
          }
        }
      };

      function formatWinsLabel(n, lang) {
        if (lang === 'cs') {
          if (n === 1) return '1 v\u00fdhra';
          if (n >= 2 && n <= 4) return `${n} v\u00fdhry`;
          return `${n} v\u00fdher`;
        }
        return n === 1 ? '1 win' : `${n} wins`;
      }

      const FACE_THEMES = [
        { id: 'classic', req: 0 },
        { id: 'tinted', req: 1 },
        { id: 'dark', req: 5 },
        { id: 'royal', req: 10 },
        { id: 'rainbow', req: 17 },
        { id: 'canasta', req: 40 }
      ];

      const BACK_THEMES = [
        { id: 'royal_blue', req: 0 },
        { id: 'crimson_crest', req: 3 },
        { id: 'emerald_geo', req: 7 },
        { id: 'noble_gold', req: 13 },
        { id: 'crimson_filigree', req: 20 },
        { id: 'blue_tartan', req: 30 }
      ];

      const ROYAL_GOLD_REQ = 52;

      function rankLabel(r) {
        if (r === 1) return 'A';
        if (r === 11) return 'J';
        if (r === 12) return 'Q';
        if (r === 13) return 'K';
        return String(r);
      }

      function isRed(suit) {
        return suit === 'hearts' || suit === 'diamonds';
      }

      function detectLang() {
        const nav = (navigator.language || 'en').toLowerCase();
        return (nav.startsWith('cs') || nav.startsWith('sk')) ? 'cs' : 'en';
      }

      let state = {
        lang: detectLang(),
        wins: 0,
        faceTheme: 'classic',
        backTheme: 'royal_blue',
        royalGold: false,
        stock: [],
        waste: [],
        foundations: [[], [], [], []],
        foundationSuits: [...DEFAULT_FOUNDATION_SUITS],
        tableau: [[], [], [], [], [], [], []],
        initialDeal: null,
        history: [],
        moves: 0,
        isGameOver: false
      };

      let selection = null;
      let hintHighlight = null;
      let autoCompleting = false;

      function t(key, vars = {}) {
        let str = I18N[state.lang][key] || key;
        for (const [k, v] of Object.entries(vars)) {
          str = str.replace(`{${k}}`, v);
        }
        return str;
      }

      function setStatus(msg) {
        document.getElementById('status-bar').textContent = msg;
      }

      function cloneBoardState() {
        return JSON.parse(JSON.stringify({
          stock: state.stock,
          waste: state.waste,
          foundations: state.foundations,
          foundationSuits: state.foundationSuits,
          tableau: state.tableau,
          moves: state.moves
        }));
      }

      function saveToStorage() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            lang: state.lang,
            wins: state.wins,
            faceTheme: state.faceTheme,
            backTheme: state.backTheme,
            royalGold: state.royalGold,
            stock: state.stock,
            waste: state.waste,
            foundations: state.foundations,
            foundationSuits: state.foundationSuits,
            tableau: state.tableau,
            initialDeal: state.initialDeal,
            history: state.history,
            moves: state.moves,
            isGameOver: state.isGameOver
          }));
        } catch (e) {}
      }

      function loadFromStorage() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return false;
          const saved = JSON.parse(raw);
          if (!saved || !Array.isArray(saved.tableau)) return false;
          Object.assign(state, saved);
          if (!Array.isArray(state.foundationSuits) || state.foundationSuits.length !== 4) {
            state.foundationSuits = [...DEFAULT_FOUNDATION_SUITS];
          }
          if (state.isGameOver) {
            state.history = [];
          }
          return true;
        } catch (e) {
          return false;
        }
      }

      function createDeck() {
        const deck = [];
        let id = 1;
        for (const suit of ALL_SUITS) {
          for (const rank of RANKS) {
            deck.push({ id: id++, suit, rank, faceUp: false });
          }
        }
        for (let i = deck.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [deck[i], deck[j]] = [deck[j], deck[i]];
        }
        return deck;
      }

      function dealNewGame() {
        autoCompleting = false;
        selection = null;
        hintHighlight = null;
        const deck = createDeck();
        const tableau = [[], [], [], [], [], [], []];
        for (let col = 0; col < 7; col++) {
          for (let row = 0; row <= col; row++) {
            const card = deck.pop();
            card.faceUp = (row === col);
            tableau[col].push(card);
          }
        }
        state.stock = deck;
        state.waste = [];
        state.foundations = [[], [], [], []];
        state.foundationSuits = [...DEFAULT_FOUNDATION_SUITS];
        state.tableau = tableau;
        state.moves = 0;
        state.history = [];
        state.isGameOver = false;
        state.initialDeal = JSON.parse(JSON.stringify({
          stock: state.stock,
          waste: [],
          foundations: [[], [], [], []],
          foundationSuits: [...DEFAULT_FOUNDATION_SUITS],
          tableau: state.tableau
        }));
        saveToStorage();
        renderAll();
        setStatus(t('newDealt'));
      }

      function restartCurrentDeal() {
        if (!state.initialDeal) {
          dealNewGame();
          return;
        }
        autoCompleting = false;
        selection = null;
        hintHighlight = null;
        const copy = JSON.parse(JSON.stringify(state.initialDeal));
        state.stock = copy.stock;
        state.waste = copy.waste;
        state.foundations = copy.foundations;
        state.foundationSuits = copy.foundationSuits || [...DEFAULT_FOUNDATION_SUITS];
        state.tableau = copy.tableau;
        state.moves = 0;
        state.history = [];
        state.isGameOver = false;
        saveToStorage();
        renderAll();
        setStatus(t('restarted'));
      }

      function pushHistory() {
        if (state.isGameOver) return;
        state.history.push(cloneBoardState());
        if (state.history.length > 60) state.history.shift();
      }

      function undoMove() {
        if (state.isGameOver || state.history.length === 0 || autoCompleting) return;
        const prev = state.history.pop();
        state.stock = prev.stock;
        state.waste = prev.waste;
        state.foundations = prev.foundations;
        state.foundationSuits = prev.foundationSuits || [...DEFAULT_FOUNDATION_SUITS];
        state.tableau = prev.tableau;
        state.moves = prev.moves;
        selection = null;
        hintHighlight = null;
        saveToStorage();
        renderAll();
        setStatus(t('ready'));
      }

      function isSuitClaimedElsewhere(suit, excludeIdx) {
        for (let i = 0; i < 4; i++) {
          if (i !== excludeIdx && state.foundations[i].length > 0 && state.foundations[i][0].suit === suit) {
            return true;
          }
        }
        return false;
      }

      function canDropManualToFoundation(card, fIdx) {
        const pile = state.foundations[fIdx];
        if (pile.length === 0) {
          return card.rank === 1 && !isSuitClaimedElsewhere(card.suit, fIdx);
        }
        const top = pile[pile.length - 1];
        return top.suit === card.suit && card.rank === top.rank + 1;
      }

      function canAutoMoveToFoundation(card, fIdx) {
        const pile = state.foundations[fIdx];
        if (pile.length === 0) {
          if (card.rank !== 1 || isSuitClaimedElsewhere(card.suit, fIdx)) return false;
          if (state.foundationSuits[fIdx] === card.suit) return true;
          const designatedIdx = state.foundationSuits.indexOf(card.suit);
          return designatedIdx !== -1 && state.foundations[designatedIdx].length > 0;
        }
        const top = pile[pile.length - 1];
        return top.suit === card.suit && card.rank === top.rank + 1;
      }

      function canMoveToTableau(card, colIdx) {
        const col = state.tableau[colIdx];
        if (col.length === 0) {
          return card.rank === 13;
        }
        const top = col[col.length - 1];
        if (!top.faceUp) return false;
        return isRed(top.suit) !== isRed(card.suit) && card.rank === top.rank - 1;
      }

      function getValidTargets(source, index, cardIndex, isManualDrag = false) {
        let cards = [];
        if (source === 'waste') {
          if (state.waste.length === 0) return [];
          cards = [state.waste[state.waste.length - 1]];
        } else if (source === 'foundation') {
          const pile = state.foundations[index];
          if (pile.length === 0) return [];
          cards = [pile[pile.length - 1]];
        } else if (source === 'tableau') {
          const col = state.tableau[index];
          if (cardIndex < 0 || cardIndex >= col.length || !col[cardIndex].faceUp) return [];
          cards = col.slice(cardIndex);
        }

        const leadCard = cards[0];
        const targets = [];

        if (cards.length === 1 && source !== 'foundation') {
          for (let f = 0; f < 4; f++) {
            const allowed = isManualDrag
              ? canDropManualToFoundation(leadCard, f)
              : canAutoMoveToFoundation(leadCard, f);
            if (allowed) {
              targets.push({ type: 'foundation', index: f });
            }
          }
        }

        for (let c = 0; c < 7; c++) {
          if (source === 'tableau' && c === index) continue;
          if (canMoveToTableau(leadCard, c)) {
            targets.push({ type: 'tableau', index: c });
          }
        }

        return targets;
      }

      function syncFoundationSuitSlot(fIdx, placedSuit) {
        const oldSuitAtSlot = state.foundationSuits[fIdx];
        if (oldSuitAtSlot === placedSuit) return;
        const otherIdx = state.foundationSuits.indexOf(placedSuit);
        state.foundationSuits[fIdx] = placedSuit;
        if (otherIdx !== -1 && state.foundations[otherIdx].length === 0) {
          state.foundationSuits[otherIdx] = oldSuitAtSlot;
        }
      }

      function executeMove(source, index, cardIndex, target) {
        if (state.isGameOver) return;
        pushHistory();
        let movingCards = [];

        if (source === 'waste') {
          movingCards = [state.waste.pop()];
        } else if (source === 'foundation') {
          movingCards = [state.foundations[index].pop()];
        } else if (source === 'tableau') {
          movingCards = state.tableau[index].splice(cardIndex);
          const rem = state.tableau[index];
          if (rem.length > 0 && !rem[rem.length - 1].faceUp) {
            rem[rem.length - 1].faceUp = true;
          }
        }

        if (target.type === 'foundation') {
          if (state.foundations[target.index].length === 0) {
            syncFoundationSuitSlot(target.index, movingCards[0].suit);
          }
          state.foundations[target.index].push(movingCards[0]);
        } else if (target.type === 'tableau') {
          state.tableau[target.index].push(...movingCards);
        }

        state.moves += 1;
        selection = null;
        hintHighlight = null;
        saveToStorage();
        renderAll();
        checkVictoryOrAutoComplete();
      }

      function drawFromStock() {
        if (state.isGameOver || autoCompleting) return;
        selection = null;
        hintHighlight = null;
        if (state.stock.length > 0) {
          pushHistory();
          const card = state.stock.pop();
          card.faceUp = true;
          state.waste.push(card);
          state.moves += 1;
          saveToStorage();
          renderAll();
          setStatus(t('ready'));
          checkVictoryOrAutoComplete();
        } else if (state.waste.length > 0) {
          pushHistory();
          while (state.waste.length > 0) {
            const c = state.waste.pop();
            c.faceUp = false;
            state.stock.push(c);
          }
          state.moves += 1;
          saveToStorage();
          renderAll();
          setStatus(t('ready'));
          checkVictoryOrAutoComplete();
        }
      }

      function handleCardTap(source, index, cardIndex) {
        if (state.isGameOver || autoCompleting) return;
        hintHighlight = null;

        if (selection && selection.source === source && selection.index === index && selection.cardIndex === cardIndex) {
          selection = null;
          renderAll();
          setStatus(t('ready'));
          return;
        }

        if (selection) {
          const matchingTarget = selection.targets.find(tg => {
            if (tg.type === 'tableau' && source === 'tableau' && tg.index === index) return true;
            if (tg.type === 'foundation' && source === 'foundation' && tg.index === index) return true;
            return false;
          });
          if (matchingTarget) {
            executeMove(selection.source, selection.index, selection.cardIndex, matchingTarget);
            setStatus(t('ready'));
            return;
          }
        }

        const targets = getValidTargets(source, index, cardIndex, false);
        if (targets.length === 0) {
          selection = null;
          renderAll();
          setStatus(t('noMoves'));
          return;
        }

        if (targets.length === 1) {
          executeMove(source, index, cardIndex, targets[0]);
          setStatus(t('ready'));
          return;
        }

        selection = { source, index, cardIndex, targets };
        renderAll();
        setStatus(t('multiTarget'));
      }

      function canAutoComplete() {
        if (state.isGameOver || autoCompleting) return false;
        for (const col of state.tableau) {
          for (const c of col) {
            if (!c.faceUp) return false;
          }
        }
        const foundationTotal = state.foundations.reduce((acc, p) => acc + p.length, 0);
        return foundationTotal < 52;
      }

      function checkVictoryOrAutoComplete() {
        const foundationTotal = state.foundations.reduce((acc, p) => acc + p.length, 0);
        if (foundationTotal === 52) {
          handleVictory();
          return;
        }
        if (canAutoComplete()) {
          runAutoComplete();
        }
      }

      function runAutoComplete() {
        if (autoCompleting) return;
        autoCompleting = true;
        selection = null;
        hintHighlight = null;
        setStatus(t('autoCompleting'));

        let stallCycles = 0;

        const step = () => {
          let moved = false;

          if (state.waste.length > 0) {
            const wTop = state.waste[state.waste.length - 1];
            for (let f = 0; f < 4; f++) {
              if (canAutoMoveToFoundation(wTop, f)) {
                state.waste.pop();
                if (state.foundations[f].length === 0) syncFoundationSuitSlot(f, wTop.suit);
                state.foundations[f].push(wTop);
                state.moves += 1;
                moved = true;
                stallCycles = 0;
                break;
              }
            }
          }

          if (!moved) {
            let bestCol = -1;
            let bestF = -1;
            let lowestRank = 99;
            for (let c = 0; c < 7; c++) {
              const col = state.tableau[c];
              if (col.length === 0) continue;
              const topCard = col[col.length - 1];
              for (let f = 0; f < 4; f++) {
                if (canAutoMoveToFoundation(topCard, f) && topCard.rank < lowestRank) {
                  lowestRank = topCard.rank;
                  bestCol = c;
                  bestF = f;
                }
              }
            }
            if (bestCol !== -1) {
              const card = state.tableau[bestCol].pop();
              if (state.foundations[bestF].length === 0) syncFoundationSuitSlot(bestF, card.suit);
              state.foundations[bestF].push(card);
              state.moves += 1;
              moved = true;
              stallCycles = 0;
            }
          }

          if (!moved && (state.stock.length > 0 || state.waste.length > 0)) {
            if (state.stock.length > 0) {
              const card = state.stock.pop();
              card.faceUp = true;
              state.waste.push(card);
              state.moves += 1;
              moved = true;
              stallCycles += 1;
            } else if (state.waste.length > 0) {
              while (state.waste.length > 0) {
                const c = state.waste.pop();
                c.faceUp = false;
                state.stock.push(c);
              }
              state.moves += 1;
              moved = true;
              stallCycles += 1;
            }
          }

          renderAll();
          const total = state.foundations.reduce((acc, p) => acc + p.length, 0);
          if (total === 52) {
            autoCompleting = false;
            handleVictory();
          } else if (moved && stallCycles <= 60) {
            setTimeout(step, 55);
          } else {
            autoCompleting = false;
            setStatus(t('ready'));
          }
        };
        setTimeout(step, 100);
      }

      function handleVictory() {
        const prevWins = state.wins;
        state.wins += 1;
        state.isGameOver = true;
        state.history = [];
        selection = null;
        hintHighlight = null;

        let unlockedSomething = false;

        const newFace = FACE_THEMES.find(f => f.req > prevWins && f.req <= state.wins);
        if (newFace) {
          state.faceTheme = newFace.id;
          unlockedSomething = true;
        }

        const newBack = BACK_THEMES.find(b => b.req > prevWins && b.req <= state.wins);
        if (newBack) {
          state.backTheme = newBack.id;
          unlockedSomething = true;
        }

        if (prevWins < ROYAL_GOLD_REQ && state.wins >= ROYAL_GOLD_REQ) {
          state.royalGold = true;
          state.faceTheme = 'royal';
          unlockedSomething = true;
        }

        saveToStorage();
        renderAll();

        document.getElementById('win-summary').textContent = t('winSummary', {
          moves: state.moves,
          wins: state.wins
        });

        const unlockMsgEl = document.getElementById('win-unlock-msg');
        if (unlockedSomething) {
          unlockMsgEl.innerHTML = t('winUnlockNewHtml');
          const settingsLink = document.getElementById('win-open-settings');
          if (settingsLink) {
            settingsLink.addEventListener('click', () => {
              closeModal('modal-win');
              openModal('modal-settings');
            });
          }
        } else {
          unlockMsgEl.innerHTML = '';
        }

        openModal('modal-win');
      }

      function showHint() {
        if (state.isGameOver || autoCompleting) return;
        selection = null;

        for (let c = 0; c < 7; c++) {
          const col = state.tableau[c];
          for (let i = 0; i < col.length; i++) {
            if (!col[i].faceUp) continue;
            if (i === 0 && col[i].rank === 13) {
              const targets = getValidTargets('tableau', c, i, false).filter(tg => tg.type === 'foundation');
              if (targets.length > 0) {
                hintHighlight = { source: 'tableau', index: c, cardIndex: i };
                renderAll();
                setStatus(t('hintMove', {
                  card: `${rankLabel(col[i].rank)} (${I18N[state.lang].suitNames[col[i].suit]})`,
                  target: t('targetFoundation')
                }));
                return;
              }
              continue;
            }
            const targets = getValidTargets('tableau', c, i, false);
            if (targets.length > 0) {
              const tg = targets[0];
              const targetLabel = tg.type === 'foundation'
                ? t('targetFoundation')
                : t('targetColumn', { col: tg.index + 1 });
              hintHighlight = { source: 'tableau', index: c, cardIndex: i };
              renderAll();
              setStatus(t('hintMove', {
                card: `${rankLabel(col[i].rank)} (${I18N[state.lang].suitNames[col[i].suit]})`,
                target: targetLabel
              }));
              return;
            }
          }
        }

        if (state.waste.length > 0) {
          const wCard = state.waste[state.waste.length - 1];
          const targets = getValidTargets('waste', 0, state.waste.length - 1, false);
          if (targets.length > 0) {
            const tg = targets[0];
            const targetLabel = tg.type === 'foundation'
              ? t('targetFoundation')
              : t('targetColumn', { col: tg.index + 1 });
            hintHighlight = { source: 'waste', index: 0, cardIndex: state.waste.length - 1 };
            renderAll();
            setStatus(t('hintMove', {
              card: `${rankLabel(wCard.rank)} (${I18N[state.lang].suitNames[wCard.suit]})`,
              target: targetLabel
            }));
            return;
          }
        }

        renderAll();
        if (state.stock.length > 0) {
          setStatus(t('hintStock'));
        } else if (state.waste.length > 0) {
          setStatus(t('hintRecycle'));
        } else {
          setStatus(t('noHints'));
        }
      }

      function renderCardBackSVG(themeId) {
        if (themeId === 'crimson_crest') {

      function createCardElement(card, source, index, cardIndex, topPx = 0) {
        const isLightBack = state.backTheme === 'crimson_filigree' || state.backTheme === 'blue_tartan';
        const el = document.createElement('div');
        el.className = 'card ' + (card.faceUp ? 'face-up ' + (isRed(card.suit) ? 'red' : 'black') : ('face-down' + (isLightBack ? ' light-back' : '')));
        el.style.top = `${topPx}px`;
        el.style.zIndex = String(cardIndex + 2);
        el.dataset.source = source;
        el.dataset.index = String(index);
        el.dataset.cardIndex = String(cardIndex);

        if (!card.faceUp) {
          el.innerHTML = renderCardBackSVG(state.backTheme);
          return el;
        }

        const rText = rankLabel(card.rank);
        const sIcon = suitSVG(card.suit);

        // Theme-specific card face rendering
        if (state.faceTheme === 'rainbow') {
          const rb = RAINBOW_BY_RANK[card.rank] || RAINBOW_BY_RANK[1];
          el.style.background = rb.bg;
          el.style.borderColor = rb.border;
          el.style.color = isRed(card.suit) ? rb.redColor : rb.blackColor;
          el.innerHTML = `
            <div class="card-top-strip">
              <span class="card-rank-sm">${rText}</span>
              <span class="card-suit-sm">${sIcon}</span>
            </div>
            <div class="card-center-hero">
              <span class="card-rank-xl">${rText}</span>
              <span class="card-suit-xl">${sIcon}</span>
            </div>
          `;
        } else if (state.faceTheme === 'canasta') {
          // Classic Canasta / Rummy double-ended bordered card face
          const isCourt = card.rank >= 11;
          const midContent = isCourt
            ? `<div class="canasta-pip-row">${sIcon}${sIcon}</div>
               <div class="canasta-center-rank">${rText}</div>
               <div class="canasta-pip-row" style="transform:rotate(180deg)">${sIcon}${sIcon}</div>`
            : `<div class="canasta-pip-row">${sIcon}</div>
               <div class="canasta-center-rank">${rText}</div>
               <div class="canasta-pip-row" style="transform:rotate(180deg)">${sIcon}</div>`;

          el.innerHTML = `
            <div class="canasta-frame">
              <div class="canasta-corner-top">
                <span class="card-rank-sm">${rText}</span>
                <span class="card-suit-sm">${sIcon}</span>
              </div>
              <div class="canasta-mid">
                ${midContent}
              </div>
              <div class="canasta-corner-bottom">
                <span class="card-rank-sm">${rText}</span>
                <span class="card-suit-sm">${sIcon}</span>
              </div>
            </div>
          `;
        } else {
          el.innerHTML = `
            <div class="card-top-strip">
              <span class="card-rank-sm">${rText}</span>
              <span class="card-suit-sm">${sIcon}</span>
            </div>
            <div class="card-center-hero">
              <span class="card-rank-xl">${rText}</span>
              <span class="card-suit-xl">${sIcon}</span>
            </div>
          `;
        }

        const isSelected = selection &&
          selection.source === source &&
          selection.index === index &&
          (source === 'tableau' ? cardIndex >= selection.cardIndex : true);

        if (isSelected) {
          el.classList.add('selected');
        }

        const isHinted = hintHighlight &&
          hintHighlight.source === source &&
          hintHighlight.index === index &&
          (source === 'tableau' ? cardIndex >= hintHighlight.cardIndex : true);

        if (isHinted) {
          el.classList.add('hint-glow');
        }

        attachCardInteraction(el, source, index, cardIndex);
        return el;
      }

      function setSourceCardsHidden(source, index, cardIndex, hidden) {
        if (source === 'tableau') {
          const colEl = document.querySelector(`.column[data-col="${index}"]`);
          if (!colEl) return;
          colEl.querySelectorAll('.card').forEach((cardEl) => {
            const idx = Number(cardEl.dataset.cardIndex);
            if (idx >= cardIndex) {
              cardEl.classList.toggle('dragging-hidden', hidden);
            }
          });
        } else if (source === 'waste') {
          const wasteCard = document.querySelector('#slot-waste .card');
          if (wasteCard) wasteCard.classList.toggle('dragging-hidden', hidden);
        } else if (source === 'foundation') {
          const fCard = document.querySelector(`#slot-f${index} .card`);
          if (fCard) fCard.classList.toggle('dragging-hidden', hidden);
        }
      }

      function attachCardInteraction(el, source, index, cardIndex) {
        let startX = 0;
        let startY = 0;
        let dragging = false;
        let dragGhost = null;

        el.addEventListener('pointerdown', (e) => {
          if (state.isGameOver || autoCompleting) return;
          if (e.button !== undefined && e.button !== 0) return;
          startX = e.clientX;
          startY = e.clientY;
          dragging = false;

          const onMove = (mv) => {
            const dx = mv.clientX - startX;
            const dy = mv.clientY - startY;
            if (!dragging && Math.hypot(dx, dy) > 8) {
              dragging = true;
              const manualTargets = getValidTargets(source, index, cardIndex, true);
              selection = { source, index, cardIndex, targets: manualTargets };
              renderSignpostOverlaysOnly();

              setSourceCardsHidden(source, index, cardIndex, true);

              const rect = el.getBoundingClientRect();
              dragGhost = document.createElement('div');
              dragGhost.style.position = 'fixed';
              dragGhost.style.width = `${rect.width}px`;
              dragGhost.style.left = `${rect.left}px`;
              dragGhost.style.top = `${rect.top}px`;
              dragGhost.style.pointerEvents = 'none';
              dragGhost.style.opacity = '0.96';
              dragGhost.style.transform = 'scale(1.05)';

              if (source === 'tableau') {
                const slice = state.tableau[index].slice(cardIndex);
                slice.forEach((c, idx) => {
                  const clone = createCardElement(c, 'ghost', 0, idx, idx * 24);
                  dragGhost.appendChild(clone);
                });
              } else {
                const cardObj = source === 'waste'
                  ? state.waste[state.waste.length - 1]
                  : state.foundations[index][state.foundations[index].length - 1];
                dragGhost.appendChild(createCardElement(cardObj, 'ghost', 0, 0, 0));
              }
              document.getElementById('drag-layer').appendChild(dragGhost);
            }

            if (dragging && dragGhost) {
              const dx = mv.clientX - startX;
              const dy = mv.clientY - startY;
              dragGhost.style.transform = `translate(${dx}px, ${dy}px) scale(1.05)`;
            }
          };

          const onUp = (up) => {
            window.removeEventListener('pointermove', onMove);
            window.removeEventListener('pointerup', onUp);

            if (dragGhost) {
              dragGhost.remove();
              dragGhost = null;
            }

            if (!dragging) {
              handleCardTap(source, index, cardIndex);
              return;
            }

            setSourceCardsHidden(source, index, cardIndex, false);

            if (selection && selection.targets.length > 0) {
              const dropEl = document.elementFromPoint(up.clientX, up.clientY);
              if (dropEl) {
                const fSlot = dropEl.closest('.slot-foundation');
                if (fSlot) {
                  const fIdx = Number(fSlot.id.replace('slot-f', ''));
                  const match = selection.targets.find(tg => tg.type === 'foundation' && tg.index === fIdx);
                  if (match) {
                    executeMove(source, index, cardIndex, match);
                    setStatus(t('ready'));
                    return;
                  }
                }
                const colEl = dropEl.closest('.column');
                if (colEl) {
                  const cIdx = Number(colEl.dataset.col);
                  const match = selection.targets.find(tg => tg.type === 'tableau' && tg.index === cIdx);
                  if (match) {
                    executeMove(source, index, cardIndex, match);
                    setStatus(t('ready'));
                    return;
                  }
                }
              }
            }

            selection = null;
            renderAll();
            setStatus(t('ready'));
          };

          window.addEventListener('pointermove', onMove);
          window.addEventListener('pointerup', onUp);
        });
      }

      function addSignpostHighlight(container, targetObj) {
        const overlay = document.createElement('div');
        overlay.className = 'signpost-target';
        overlay.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          if (!selection) return;
          executeMove(selection.source, selection.index, selection.cardIndex, targetObj);
          setStatus(t('ready'));
        });
        container.appendChild(overlay);
      }

      function renderSignpostOverlaysOnly() {
        document.querySelectorAll('.signpost-target').forEach(el => el.remove());
        if (!selection || selection.targets.length === 0) return;

        selection.targets.forEach(tg => {
          if (tg.type === 'foundation') {
            const fSlot = document.getElementById(`slot-f${tg.index}`);
            if (fSlot) addSignpostHighlight(fSlot, tg);
          } else if (tg.type === 'tableau') {
            const colEl = document.querySelector(`.column[data-col="${tg.index}"]`);
            if (!colEl) return;
            const cards = colEl.querySelectorAll('.card');
            if (cards.length > 0) {
              addSignpostHighlight(cards[cards.length - 1], tg);
            } else {
              const emptyBox = colEl.querySelector('.column-empty-target');
              if (emptyBox) addSignpostHighlight(emptyBox, tg);
            }
          }
        });
      }

      function renderAll() {
        applyThemeClasses();

        document.getElementById('lbl-wins').textContent = t('wins');
        document.getElementById('lbl-stock').textContent = t('stock');
        document.getElementById('lbl-undo').textContent = t('undo');
        document.getElementById('lbl-rules').textContent = t('rules');
        document.getElementById('lbl-hint').textContent = t('hint');
        document.getElementById('lbl-new').textContent = t('newGame');

        document.getElementById('val-wins').textContent = state.wins;
        document.getElementById('val-stock').textContent = state.stock.length;

        const undoBtn = document.getElementById('btn-undo');
        undoBtn.disabled = state.isGameOver || state.history.length === 0 || autoCompleting;

        // Render Stock
        const stockEl = document.getElementById('slot-stock');
        stockEl.innerHTML = '';
        if (state.stock.length > 0) {
          const backCard = createCardElement({ faceUp: false }, 'stock', 0, 0, 0);
          stockEl.appendChild(backCard);
        } else if (state.waste.length > 0) {
          stockEl.innerHTML = '<span class="stock-recycle">\u21bb</span>';
        }

        // Render Waste
        const wasteEl = document.getElementById('slot-waste');
        wasteEl.innerHTML = '';
        if (state.waste.length > 0) {
          const topWaste = state.waste[state.waste.length - 1];
          wasteEl.appendChild(createCardElement(topWaste, 'waste', 0, state.waste.length - 1, 0));
        }

        // Render Foundations
        for (let f = 0; f < 4; f++) {
          const fEl = document.getElementById(`slot-f${f}`);
          const slotSuit = state.foundationSuits[f] || DEFAULT_FOUNDATION_SUITS[f];
          fEl.innerHTML = `<div style="width:22px;height:22px;opacity:0.22;">${suitSVG(slotSuit)}</div>`;
          const pile = state.foundations[f];
          if (pile.length > 0) {
            const topF = pile[pile.length - 1];
            fEl.appendChild(createCardElement(topF, 'foundation', f, pile.length - 1, 0));
          }
        }

        // Render Tableau
        const tabRow = document.getElementById('tableau-row');
        const availHeight = tabRow.clientHeight || 380;
        tabRow.innerHTML = '';

        for (let c = 0; c < 7; c++) {
          const colEl = document.createElement('div');
          colEl.className = 'column';
          colEl.dataset.col = String(c);

          const colCards = state.tableau[c];
          if (colCards.length === 0) {
            const emptyBox = document.createElement('div');
            emptyBox.className = 'column-empty-target';
            emptyBox.textContent = 'K';
            colEl.appendChild(emptyBox);
          } else {
            const maxUsable = Math.max(180, availHeight - 88);
            const defaultFaceUpGap = 25;
            const defaultFaceDownGap = 11;
            let totalNeeded = 0;
            for (let i = 0; i < colCards.length - 1; i++) {
              totalNeeded += colCards[i].faceUp ? defaultFaceUpGap : defaultFaceDownGap;
            }
            const scale = totalNeeded > maxUsable ? (maxUsable / totalNeeded) : 1;

            let y = 0;
            colCards.forEach((card, idx) => {
              const cardEl = createCardElement(card, 'tableau', c, idx, Math.round(y));
              colEl.appendChild(cardEl);
              y += (card.faceUp ? defaultFaceUpGap : defaultFaceDownGap) * scale;
            });
          }
          tabRow.appendChild(colEl);
        }

        if (selection && selection.targets.length > 1) {
          renderSignpostOverlaysOnly();
        }
      }

      function applyThemeClasses() {
        document.body.classList.remove('royal-gold', 'face-tinted', 'face-dark', 'face-royal', 'face-rainbow', 'face-canasta');
        if (state.royalGold && state.wins >= ROYAL_GOLD_REQ) {
          document.body.classList.add('royal-gold');
          document.getElementById('meta-theme-color').setAttribute('content', '#0f172a');
        } else {
          document.getElementById('meta-theme-color').setAttribute('content', '#f0f2f5');
        }
        if (state.faceTheme && state.faceTheme !== 'classic') {
          document.body.classList.add(`face-${state.faceTheme}`);
        }
      }

      function renderSettingsModal() {
        document.getElementById('modal-settings-title').textContent = t('settingsTitle');
        document.getElementById('stat-lbl-moves').textContent = t('moves');
        document.getElementById('stat-val-moves').textContent = state.moves;
        document.getElementById('stat-lbl-cards').textContent = t('cardsCount');
        document.getElementById('stat-val-cards').textContent = '52';
        document.getElementById('stat-lbl-wins').textContent = t('wins');
        document.getElementById('stat-val-wins').textContent = state.wins;

        document.getElementById('lbl-lang-title').textContent = t('langTitle');
        document.getElementById('lbl-faces-title').textContent = t('facesTitle');
        document.getElementById('lbl-backs-title').textContent = t('backsTitle');
        document.getElementById('lbl-royal-title').textContent = t('royalTitle');
        document.getElementById('settings-unlock-info').innerHTML = t('settingsUnlockInfo');
        document.getElementById('btn-restart-deal').textContent = t('restartBtn');
        document.getElementById('btn-close-settings').textContent = t('saveCloseBtn');

        document.getElementById('lang-cs').classList.toggle('active', state.lang === 'cs');
        document.getElementById('lang-en').classList.toggle('active', state.lang === 'en');

        // Face themes
        const facesGrid = document.getElementById('face-themes-grid');
        facesGrid.innerHTML = '';
        FACE_THEMES.forEach(ft => {
          const unlocked = state.wins >= ft.req;
          const active = state.faceTheme === ft.id;
          const reqText = ft.req === 0
            ? t('unlockedFree')
            : (unlocked ? `\u2713 ${formatWinsLabel(ft.req, state.lang)}` : `\ud83d\udd12 ${formatWinsLabel(ft.req, state.lang)}`);
          const btn = document.createElement('button');
          btn.className = 'unlock-card' + (active ? ' active' : '') + (!unlocked ? ' locked' : '');
          btn.innerHTML = `
            ${active ? '<span class="unlock-check">\u2713</span>' : ''}
            <span class="unlock-name">${I18N[state.lang].faces[ft.id]}</span>
            <span class="unlock-req">${reqText}</span>
          `;
          if (unlocked) {
            btn.addEventListener('click', () => {
              state.faceTheme = ft.id;
              saveToStorage();
              renderSettingsModal();
              renderAll();
            });
          }
          facesGrid.appendChild(btn);
        });

        // Back themes
        const backsGrid = document.getElementById('back-themes-grid');
        backsGrid.innerHTML = '';
        BACK_THEMES.forEach(bt => {
          const unlocked = state.wins >= bt.req;
          const active = state.backTheme === bt.id;
          const reqText = bt.req === 0
            ? t('unlockedFree')
            : (unlocked ? `\u2713 ${formatWinsLabel(bt.req, state.lang)}` : `\ud83d\udd12 ${formatWinsLabel(bt.req, state.lang)}`);
          const btn = document.createElement('button');
          btn.className = 'unlock-card' + (active ? ' active' : '') + (!unlocked ? ' locked' : '');
          btn.innerHTML = `
            ${active ? '<span class="unlock-check">\u2713</span>' : ''}
            <span class="unlock-name">${I18N[state.lang].backs[bt.id]}</span>
            <span class="unlock-req">${reqText}</span>
          `;
          if (unlocked) {
            btn.addEventListener('click', () => {
              state.backTheme = bt.id;
              saveToStorage();
              renderSettingsModal();
              renderAll();
            });
          }
          backsGrid.appendChild(btn);
        });

        // Royal Gold Edition tile (52 wins)
        const royalUnlocked = state.wins >= ROYAL_GOLD_REQ;
        const royalBox = document.getElementById('royal-gold-box');
        royalBox.innerHTML = '';
        const rBtn = document.createElement('button');
        rBtn.className = 'unlock-card' + (state.royalGold ? ' active' : '') + (!royalUnlocked ? ' locked' : '');
        rBtn.innerHTML = `
          ${state.royalGold ? '<span class="unlock-check">\u2713</span>' : ''}
          <span class="unlock-name">\u265b ${t('royalName')}</span>
          <span class="unlock-req">${!royalUnlocked ? `\ud83d\udd12 ${formatWinsLabel(ROYAL_GOLD_REQ, state.lang)}` : (state.royalGold ? t('royalActive') : t('royalReady'))}</span>
        `;
        if (royalUnlocked) {
          rBtn.addEventListener('click', () => {
            state.royalGold = !state.royalGold;
            if (state.royalGold) {
              state.faceTheme = 'royal';
              state.backTheme = 'noble_gold';
            }
            saveToStorage();
            renderSettingsModal();
            renderAll();
          });
        }
        royalBox.appendChild(rBtn);
      }

        document.getElementById(id).classList.add('open');

      function closeModal(id) {
        document.getElementById(id).classList.remove('open');
      }

      // Secret Testing Gestures:
      // 5x tap on "Nastavení hry" -> jumps directly to the NEXT bonus milestone & applies it immediately
      const ALL_MILESTONES = [1, 3, 5, 7, 10, 13, 17, 20, 30, 40, 52];
      let titleTapCount = 0;
      let titleTapTimer = null;
      document.getElementById('modal-settings-title').addEventListener('click', () => {
        titleTapCount += 1;
        clearTimeout(titleTapTimer);
        if (titleTapCount >= 5) {
          titleTapCount = 0;
          const nextMilestone = ALL_MILESTONES.find(m => m > state.wins);
          const prevWins = state.wins;
          state.wins = nextMilestone !== undefined ? nextMilestone : (state.wins + 1);

          const newFace = FACE_THEMES.find(f => f.req > prevWins && f.req <= state.wins);
          if (newFace) state.faceTheme = newFace.id;

          const newBack = BACK_THEMES.find(b => b.req > prevWins && b.req <= state.wins);
          if (newBack) state.backTheme = newBack.id;

          if (prevWins < ROYAL_GOLD_REQ && state.wins >= ROYAL_GOLD_REQ) {
            state.royalGold = true;
            state.faceTheme = 'royal';
          }

          saveToStorage();
          renderSettingsModal();
          renderAll();
          setStatus(t('winUnlockNewHtml').replace(/<[^>]*>/g, ''));
          return;
        }
        titleTapTimer = setTimeout(() => { titleTapCount = 0; }, 1500);
      });

      // Event Bindings
      document.getElementById('slot-stock').addEventListener('click', drawFromStock);
      document.getElementById('btn-undo').addEventListener('click', undoMove);
      document.getElementById('btn-hint').addEventListener('click', showHint);
      document.getElementById('btn-rules').addEventListener('click', () => openModal('modal-rules'));
      document.getElementById('btn-settings').addEventListener('click', () => openModal('modal-settings'));
      document.getElementById('btn-new').addEventListener('click', () => openModal('modal-new'));

      document.getElementById('btn-close-settings').addEventListener('click', () => closeModal('modal-settings'));
      document.getElementById('btn-close-rules').addEventListener('click', () => closeModal('modal-rules'));
      document.getElementById('btn-close-new').addEventListener('click', () => closeModal('modal-new'));

      document.getElementById('btn-restart-deal').addEventListener('click', () => {
        closeModal('modal-settings');
        restartCurrentDeal();
      });

      document.getElementById('opt-deal-new').addEventListener('click', () => {
        closeModal('modal-new');
        dealNewGame();
      });

      document.getElementById('opt-restart-same').addEventListener('click', () => {
        closeModal('modal-new');
        restartCurrentDeal();
      });

      document.getElementById('btn-win-new').addEventListener('click', () => {
        closeModal('modal-win');
        dealNewGame();
      });

      document.getElementById('lang-cs').addEventListener('click', () => {
        state.lang = 'cs';
        saveToStorage();
        renderSettingsModal();
        renderAll();
        setStatus(t('ready'));
      });

      document.getElementById('lang-en').addEventListener('click', () => {
        state.lang = 'en';
        saveToStorage();
        renderSettingsModal();
        renderAll();
        setStatus(t('ready'));
      });

      document.querySelectorAll('.modal-backdrop').forEach(backdrop => {
        backdrop.addEventListener('click', (e) => {
          if (e.target === backdrop) backdrop.classList.remove('open');
        });
      });

      window.addEventListener('resize', () => renderAll());

      // Boot
      if (!loadFromStorage()) {
        dealNewGame();
      } else {
        renderAll();
        checkVictoryOrAutoComplete();
        setStatus(t('ready'));
      }
    })();
  </script>
</body>
</html>
