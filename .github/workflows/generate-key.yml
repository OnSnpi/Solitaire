name: Generate Signing Key
on: workflow_dispatch
jobs:
  make-key:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Generate and Zip Keystore
        run: |
          keytool -genkey -v -keystore solitaire.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 36500 -storepass android -keypass android -dname "CN=Ondrandy,O=Ondrandy,C=CZ"
          base64 -w 0 solitaire.keystore > key-base64.txt
      - name: Upload Keystore Text
        uses: actions/upload-artifact@v5
        with:
          name: Keystore-Base64
          path: key-base64.txt
